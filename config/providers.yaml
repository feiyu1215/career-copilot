# Career Copilot — LLM Provider 扩展注册表
#
# 内置 4 个 provider（friday / sub2api / nvidia / agnes）由 scripts/llm_client.py
# 中的环境变量驱动定义，无需在此重复。本文件用于【扩展】 provider（新增 / 覆盖），
# 无需改代码即可接入新后端。
#
# 新增一个 provider（含本地 ollama）只需在此添加一项；若要让它参与自动降级，
# 需把它加入环境变量 LLM_FAILOVER_CHAIN（本地 provider 默认不进降级链）。
#
# 字段说明：
#   base_url        OpenAI 兼容端点
#   api_key         鉴权 key（本地 provider 留空 "")
#   default_model   默认模型
#   available_models 可选模型列表
#   local           true=本地/隐私模式，跳过 api_key 校验、可进入候选
#   description     说明

providers:
  ollama:
    base_url: "http://localhost:11434/v1"
    api_key: ""
    default_model: "llama3"
    available_models: ["llama3", "qwen2.5", "mistral"]
    local: true
    description: "本地 Ollama（OpenAI 兼容，隐私模式：JD/简历不出本机）"
